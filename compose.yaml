name: nms-desk

# Tickets UI is the existing Windshift instance at pm. This project is the
# Lockhaven HMAC ingest sidecar only. Do not start Zammad from here.

services:
  ingest:
    build: .
    env_file: .env
    environment:
      PORT: ${INGEST_PORT:-4000}
      WINDSHIFT_URL: ${WINDSHIFT_URL:-http://windshift:8080}
      WINDSHIFT_API_TOKEN: ${WINDSHIFT_API_TOKEN:-}
      WINDSHIFT_WORKSPACE: ${WINDSHIFT_WORKSPACE:-}
    ports:
      - "127.0.0.1:${INGEST_PORT:-4000}:4000"
    labels:
      - caddy_0=${PUBLIC_HOST:-tickets.newmarketsecurity.com}
      - caddy_0.handle=/ingest*
      - caddy_0.handle.reverse_proxy={{upstreams 4000}}
      - traefik.enable=true
      - traefik.docker.network=${EDGE_NETWORK:-proxy}
      - traefik.http.routers.desk-ingest.rule=Host(`${PUBLIC_HOST:-tickets.newmarketsecurity.com}`) && PathPrefix(`/ingest`)
      - traefik.http.routers.desk-ingest.priority=100
      - traefik.http.routers.desk-ingest.entrypoints=websecure
      - traefik.http.routers.desk-ingest.tls=true
      - traefik.http.routers.desk-ingest.tls.certresolver=letsencrypt
      - traefik.http.services.desk-ingest.loadbalancer.server.port=4000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.status===200||r.status===503?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    mem_limit: 128m
    networks:
      nms-desk: {}
      edge: {}
      pm: {}

networks:
  nms-desk:
    name: nms-desk
  edge:
    name: ${EDGE_NETWORK:-proxy}
    external: true
  pm:
    name: nms-pm
    external: true
